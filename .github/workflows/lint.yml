name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache golangci-lint binaries
        uses: actions/cache@v4
        with:
          path: |
            bin/golangci-lint
            bin/golangci-lint-v2.13.0
            ~/.cache/golangci-lint
          key: gci-${{ runner.os }}-v2.13.0-${{ hashFiles('.custom-gcl.yml', '.golangci.yml', 'go.sum') }}
          restore-keys: |
            gci-${{ runner.os }}-v2.13.0-

      - name: Check linter configuration
        run: make lint-config

      - name: Run linter
        run: make lint
