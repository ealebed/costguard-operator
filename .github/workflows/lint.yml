name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # golangci-lint spends ~90% of its runtime building export data for the
      # ~1300-package dependency graph. That work happens inside a single
      # `go list -export` subprocess which its own --timeout cannot interrupt,
      # so on a cold build cache the lint step appears to hang. Doing it here
      # keeps the lint step short and its timeout meaningful.
      - name: Warm export-data cache
        run: go list -e -export -deps ./... > /dev/null

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
